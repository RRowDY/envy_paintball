<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paintball UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Template Function -->
    <script>
        function createMenuElement(menuId, title) {
            const menu = document.createElement('div');
            menu.className = 'paintball-ui hidden';
            menu.id = `${menuId}-ui`;
            menu.setAttribute('data-menu-id', menuId);
            
            menu.innerHTML = `
                <div class="paintball-container">
                    <div class="paintball-box">
                        <div class="paintball-accent-top"></div>
                        <div class="paintball-content">
                            <div class="paintball-header">
                                <h2 class="paintball-title">${title}</h2>
                                <button class="paintball-close" type="button" aria-label="Close">×</button>
                            </div>
                            <div class="paintball-menu"></div>
                        </div>
                        <div class="paintball-accent-bottom"></div>
                    </div>
                </div>
            `;
            
            return menu;
        }
        
        function createDialogElement(dialogId, title) {
            const dialog = document.createElement('div');
            dialog.className = 'paintball-ui hidden';
            dialog.id = `${dialogId}-ui`;
            dialog.setAttribute('data-dialog-id', dialogId);
            
            dialog.innerHTML = `
                <div class="paintball-container">
                    <div class="paintball-box">
                        <div class="paintball-accent-top"></div>
                        <div class="paintball-content">
                            <div class="paintball-header">
                                <h2 class="paintball-title">${title}</h2>
                                <button class="paintball-close" type="button" aria-label="Close">×</button>
                            </div>
                            <div class="paintball-dialog">
                                <div class="error-message" style="display: none;"></div>
                            </div>
                        </div>
                        <div class="paintball-accent-bottom"></div>
                    </div>
                </div>
            `;
            
            return dialog;
        }
    </script>

    <!-- Press E UI -->
    <div id="press-e-ui" class="press-e-ui hidden">
        <div class="press-e-container">
            <div class="press-e-box">
                <div class="press-e-accent-top"></div>
                <div class="press-e-content">
                    <div class="press-e-text" id="press-e-text"></div>
                </div>
                <div class="press-e-accent-bottom"></div>
            </div>
        </div>
    </div>

    <!-- Scoreboard UI -->
    <div id="scoreboard-ui" class="scoreboard-ui hidden">
        <div class="scoreboard-container">
            <div class="scoreboard-box">
                <div class="scoreboard-accent-top"></div>
                <div class="scoreboard-content">
                    <div class="scoreboard-header">
                        <h3 class="scoreboard-title" id="scoreboard-title">Scoreboard</h3>
                    </div>
                    <div class="scoreboard-body" id="scoreboard-body">
                        <!-- Scoreboard content will be inserted here -->
                    </div>
                </div>
                <div class="scoreboard-accent-bottom"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
